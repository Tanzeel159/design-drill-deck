name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Assemble TRMNL layouts
        run: python scripts/build_layouts.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project files
        run: python scripts/validate_project.py

      - name: Test a clean daily-feed build
        run: python scripts/generate_daily.py --date 2026-07-20 --output _site/daily.json
