name: Generate prompt batch

on:
  schedule:
    # Monday 09:00 America/Chicago (14:00 UTC). One run may use the week's two-request cap.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: Call gpt-5-mini and persist accepted cards into the daily feed
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: prompt-generation-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore local generation budget and saved queue
        uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: generation-preview-${{ github.run_id }}
          restore-keys: generation-preview-
      - name: Generate prompt batch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_LIVE: ${{ github.event_name == 'schedule' || inputs.live }}
        run: |
          if [ "$RUN_LIVE" = "true" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "Add OPENAI_API_KEY as a repository secret (Settings → Secrets and variables → Actions)."
              exit 1
            fi
            python scripts/generate_prompts.py --live
          else
            python scripts/generate_prompts.py --mock
          fi
      - name: Save budget and queue
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime
          key: generation-preview-${{ github.run_id }}
      - name: Downloadable preview data
        uses: actions/upload-artifact@v4
        with:
          name: generated-prompts-preview
          path: |
            .runtime/*.json
            data/generated.json
            data/daily.json
          include-hidden-files: true
      - name: Persist accepted prompts on the default branch
        if: github.event_name == 'schedule' || inputs.live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated.json data/daily.json
          if git diff --cached --quiet; then
            echo "No accepted generated prompts to persist."
          else
            git commit -m "Add accepted gpt-5-mini prompt batch."
            git push
          fi
      - name: Publish daily feed to GitHub Pages
        if: github.event_name == 'schedule' || inputs.live
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-daily.yml',
              ref: 'main'
            });
