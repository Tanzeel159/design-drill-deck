name: Publish daily prompt

on:
  push:
    branches:
      - main
  schedule:
    - cron: "5 0 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      date:
        description: Optional date override (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate project files
        run: python scripts/validate_project.py

      - name: Build daily feed
        run: python scripts/generate_daily.py --date "${{ inputs.date }}" --output _site/daily.json

      - name: Add feed landing page
        run: cp public/index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy daily feed
        id: deployment
        uses: actions/deploy-pages@v4
