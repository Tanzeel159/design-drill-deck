<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Design Drill Deck · Local studio</title>
  <link rel="stylesheet" href="vendor/plugins.css">
  <link rel="stylesheet" href="studio.css">
  <script src="vendor/liquid.js"></script>
</head>
<body class="trmnl">
  <header class="studio-header">
    <div><a class="wordmark" href="./">Design Drill Deck<span class="local-tag">LOCAL STUDIO</span></a><p>One clear challenge. A little practice, every day.</p></div>
    <div class="header-actions"><span id="status" role="status">Loading saved deck…</span><button id="brief-toggle" type="button" aria-expanded="false" aria-controls="brief-panel">Read full brief ↗</button></div>
  </header>
  <div class="controls">
    <label>Device<select id="device-select"></select></label>
    <label>Category<select id="focus-select"></select></label>
    <label class="prompt-control">Prompt<select id="drill-select"></select></label>
    <label>Level<select id="difficulty-select"></select></label>
    <label>Source<select id="source-select"><option value="auto">Fresh, then saved deck</option><option value="curated">Offline deck · 54 cards</option><option value="mock">API demo · sample responses</option></select></label>
    <label>Order<select id="rotation-select"><option value="smart_shuffle">Smart shuffle</option><option value="sequential">Sequential</option></select></label>
  </div>
  <main class="workbench">
    <section class="canvas-pane" aria-label="Device preview">
      <div class="canvas-tools"><div><span id="device-label"></span><span id="variant-label"></span></div><div class="zoom-tools"><button id="previous" aria-label="Previous prompt">←</button><button id="next" aria-label="Next prompt">→</button><label class="zoom-label">View<select id="zoom-select"><option value="fit">Fit to window</option><option value="native">Actual pixels · 100%</option></select></label></div></div>
      <div id="preview-stage"><div id="device-canvas"><div id="device-zoom"></div></div></div>
      <div class="canvas-caption"><span id="selection-label"></span><span id="scale-label"></span></div>
    </section>
    <aside id="brief-panel" hidden aria-label="Complete exercise"><div class="brief-heading"><span>THE COMPLETE BRIEF</span><button id="brief-close" aria-label="Close full brief">×</button></div><div id="brief-content"></div></aside>
  </main>
  <footer class="studio-footer"><span id="source-status">Local preview · the live device is unchanged</span><span id="fit-status" role="status"></span></footer>
  <script src="studio.js"></script>
</body>
</html>
