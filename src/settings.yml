---
# Polling feed: GET polling_url (GitHub Pages daily.json).
# The JSON is already shaped for Liquid — a serverless transform is optional
# (src/transform.js). Merge variables used by shared.liquid:
#   prompts, daily_picks, difficulty_levels, display_date, rotation_date,
#   default_difficulty, default_rotation_mode
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: ''
polling_url: https://Tanzeel159.github.io/design-drill-deck/daily.json
polling_headers: ''
polling_body: ''
id: 472554
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  name: About Design Drill Deck
  field_type: author_bio
  category: education,productivity
  description: A focused product-design interview drill, refreshed once per day. Questions or issues? Email Tanzeel or open a GitHub issue.
  email_address: tanzeel.ahmed1306@gmail.com
  github_url: https://github.com/Tanzeel159/design-drill-deck
  learn_more_url: https://tanzeelcrafts.tech
- keyname: focus_area
  name: Focus area
  field_type: select
  description: Choose a discipline, or practice all nine categories. Labels are for display; the saved value is the lowercase category key.
  help_text: All categories rotates through Core UX, AI interfaces, dashboards, accessibility, enterprise, UX engineering, IA, everyday UX, and dark patterns. Pick one discipline to stay in that pool. The plugin stores the option’s key in lowercase (for example core_ux_flow) to match the daily deck.
  options:
  - All categories: all_categories
  - Core UX Flow: core_ux_flow
  - AI-Integrated Interface: ai_integrated_interface
  - Dashboard & Data UX: dashboard_data_ux
  - Accessibility Challenge: accessibility_challenge
  - Enterprise UX: enterprise_ux
  - UX Engineering: ux_engineering
  - Information Architecture: information_architecture
  - Everyday UX: everyday_ux
  - Dark Patterns: dark_patterns
  default: all_categories
- keyname: difficulty
  name: Practice level
  field_type: select
  description: Changes the expected solution depth while keeping prompts varied.
  options:
  - Beginner (focused flow): beginner
  - Intermediate (flow and edge cases): intermediate
  - Advanced (systems thinking): advanced
  default: intermediate
- keyname: rotation_mode
  name: Prompt order
  field_type: select
  description: Smart shuffle avoids repeats until every eligible prompt has appeared.
  options:
  - Smart shuffle (no repeats): smart_shuffle
  - Sequential bank order: sequential
  default: smart_shuffle
name: Design Drill Deck
description: One clear design challenge, daily
refresh_interval: 60
